<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
</head>
    <title>Post-IG</title>
</head>
<body>
    <div class="post">
        <div class="post-header">
            <div class="post-heder-icons">
               <i class="fab fa-html5 fa-xl" ></i>
               <p><strong>HTML</strong>  <br> Julian</p>
            </div>   
            <div class="post-header-icons2">
                <i class="fa-solid fa-ellipsis-vertical fa-lg"></i>
            </div>
            
        </div>
        <div class="post-img">
            <img 
            src="https://picsum.photos/600/400" 
            alt="paisaje" />
        </div>
        <div class="post-icons" >
            <div class="post-icons-footer">
                <i class="fa-regular fa-comment fa-xl" ></i>
                <i class= "fa-regular fa-heart fa-xl" ></i>
                <i class="fa-regular fa-paper-plane fa-xl"></i>            
            </div>
            <div class="post-icons-footer2">
                <i class="fa-regular fa-bookmark fa-xl"></i>
            </div>
        </div>
        <div class="post-body">
            <p>
                Liked by <strong>4GeeksAcademy, html5, web</strong> and <strong>100,000 others</strong>
            </p>
            <p>
                Lorem, ipsum dolor sit amet consectetur adipisicing elit. Excepturi et doloremque saepe nemo, eum odio vitae exercitationem dicta ullam reiciendis.
            </p>
        </div>
